# R CMD check en Linux, macOS y Windows (el paquete vive en quasar/).
# Verifica que el backend Rust compila en las tres plataformas de CRAN.
name: R-CMD-check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel'}
          # macos-14 (SDK estable) en vez de macos-latest (macOS 26 bleeding-edge,
          # donde Rust targetea una versión más nueva que R y el linker avisa).
          - {os: macos-14,       r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      # pak: incluir LinkingTo al construir de fuente (RSPM sirve RSQLite como
      # source y su LinkingTo cpp11 no entra en el plan -> falla sin esto).
      PKG_INCLUDE_LINKINGTO: true
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain para el backend (extendr + Polars).
      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: quasar
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: quasar
          upload-snapshots: true
          # Solo los ERRORES rompen el job. En macOS, rustc compila la .a para
          # el SDK instalado (p.ej. 14.5) y R enlaza contra una versión anterior
          # (14.0) -> ld avisa "built for newer macOS version". Es benigno (el
          # paquete enlaza y corre); no debe tumbar la CI. Si CRAN lo señala, se
          # fija MACOSX_DEPLOYMENT_TARGET en Makevars.
          error-on: '"error"'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
